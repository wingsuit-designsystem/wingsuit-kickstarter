services:
  db:
    image: wodby/mariadb:$MARIADB_TAG
    container_name: "${PROJECT_NAME}_db"
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/mysql # Docker volume sync

  php:
    container_name: "${PROJECT_NAME}_php"
    volumes:
      - public_files:/var/www/html/docroot/sites/default/files
      - private_files:/var/www/html/private-files
    # this image will be reused as `CLI_IMAGE` in subsequent Docker builds
    build:
      context: .
      dockerfile: .coolify/php.dockerfile
      target: drupalbuilder
    environment:
      PHP_SENDMAIL_PATH: /usr/sbin/sendmail -t -i -S mailpit:1025
      DB_HOST: db
      DB_USER: drupal
      DB_PASSWORD: drupal
      DB_ROOT_PASSWORD: admin123
      DB_NAME: drupal
      DB_DRIVER: mysql
      COLUMNS: 80 # Set 80 columns for docker exec -it.
      DOCROOT_SUBDIR: ""
      WODBY_APP_SUBSITE: default
      HTTP_ROOT: /var/www/html/docroot
      APP_ROOT: /var/www/html
      CONF_DIR: /var/www/html/conf
      DRUPAL_VERSION: "11"
      DRUSH_OPTIONS_URI: ${COOLFIY_URL}
      DRUPAL_SITE: "default"
      DRUPAL_SITE_DIR: "/var/www/html/docroot/sites/default"
      DRUPAL_HASH_SALT: "bad-hash-salt-must-be-32-characters_long"
      DRUPAL_FILES_SYNC_SALT: "files-sync-bad-salt"
      PHP_FPM_USER: "wodby"
      PHP_FPM_GROUP: "wodby"
      WODBY_HOSTS: '["${COOLIFY_URL}"]'
      WODBY_PRIMARY_HOST: "$COOLIFY_URL"
    networks:
      - default

  nginx:
    container_name: "${PROJECT_NAME}_nginx"
    build:
      context: .
      dockerfile: .coolify/php.dockerfile
      target: nginxbuilder
    volumes:
      - public_files:/var/www/html/docroot/sites/default/files
      - private_files:/var/www/html/private-files
    depends_on:
      - php
    environment:
      NGINX_STATIC_OPEN_FILE_CACHE: 'off'
      NGINX_ERROR_LOG_LEVEL: debug
      NGINX_BACKEND_HOST: php
      NGINX_SERVER_ROOT: /var/www/html/docroot
      NGINX_VHOST_PRESET: $NGINX_VHOST_PRESET
      NGINX_DRUPAL_FILE_PROXY_URL: $COOLIFY_URL


  # varnish:
