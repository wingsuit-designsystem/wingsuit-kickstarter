services:
  db:
    image: wodby/mariadb:$MARIADB_TAG
    container_name: "${PROJECT_NAME}_db"
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
    volumes:
      - db:/var/lib/mysql # Docker volume sync

  php:
    container_name: "${PROJECT_NAME}_php"
    image: &php-image ${PROJECT_NAME:-drupal-base}-php # this image will be reused as `CLI_IMAGE` in subsequent Docker builds
    build:
      context: .
      dockerfile: docker/php.dockerfile
    environment:
      PHP_SENDMAIL_PATH: /usr/sbin/sendmail -t -i -S mailhog:1025
      DB_HOST: db
      DB_USER: drupal
      DB_PASSWORD: drupal
      DB_ROOT_PASSWORD: admin123
      DB_NAME: drupal
      DB_DRIVER: mysql
      COLUMNS: 80 # Set 80 columns for docker exec -it.
      DOCROOT_SUBDIR: ""
      WODBY_APP_SUBSITE: default
      HTTP_ROOT: /var/www/html/docroot
      APP_ROOT: /var/www/html
      CONF_DIR: /var/www/html/conf
      DRUPAL_VERSION: "11"
      DRUSH_OPTIONS_URI: ${COOLFIY_URL}
      DRUPAL_SITE: "default"
      DRUPAL_SITE_DIR: "/var/www/html/docroot/sites/default"
      DRUPAL_HASH_SALT: "bad-hash-salt-must-be-32-characters_long"
      DRUPAL_FILES_SYNC_SALT: "files-sync-bad-salt"
      PHP_FPM_USER: "wodby"
      PHP_FPM_GROUP: "wodby"
      WODBY_HOSTS: '["${COOLIFY_URL}"]'
      WODBY_PRIMARY_HOST: "$COOLIFY_URL"
    networks:
      - default
      - coolify

  nginx:
    container_name: "${PROJECT_NAME}_nginx"
    build:
      context: .
      dockerfile: docker/nginx.dockerfile
      args:
        PHP_IMAGE: *php-image # Inject the name of the cli image
    networks:
      - default
      - coolify
    depends_on:
      - php
    environment:
      NGINX_STATIC_OPEN_FILE_CACHE: 'off'
      NGINX_ERROR_LOG_LEVEL: debug
      NGINX_BACKEND_HOST: php
      NGINX_SERVER_ROOT: /var/www/html/docroot
      NGINX_VHOST_PRESET: $NGINX_VHOST_PRESET
      NGINX_DRUPAL_FILE_PROXY_URL: $COOLIFY_URL
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT_NAME}_nginx.entrypoints=https'
      - 'traefik.http.routers.${PROJECT_NAME}_nginx.rule=Host(`${COOLIFY_URL}`)'
      ## if varnish is enabled disable above label and enable the following
      # - "traefik.http.routers.${PROJECT_NAME}_nginx.rule=Host(`nginx-${COOLIFY_URL}`)"
      - 'traefik.http.routers.${PROJECT_NAME}_nginx.tls=true'
      - 'traefik.http.services.${PROJECT_NAME}_nginx.loadbalancer.server.port=80'
      - 'traefik.http.routers.${PROJECT_NAME}_nginx.service=${PROJECT_NAME}_nginx@docker'
      - 'traefik.docker.network=traefik_proxy'


  # varnish:
  #   image: wodby/varnish:$VARNISH_TAG
  #   networks:
  #     - default
  #     - traefik
  #   container_name: "${PROJECT_NAME}_varnish"
  #   depends_on:
  #     - nginx
  #   environment:
  #     VARNISH_SECRET: secret
  #     VARNISH_BACKEND_HOST: nginx
  #     VARNISH_BACKEND_PORT: 80
  #     VARNISH_CONFIG_PRESET: drupal
  #     VARNISH_PURGE_EXTERNAL_REQUEST_HEADER: X-Real-IP
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.${PROJECT_NAME}_varnish.entrypoints=https"
  #     - "traefik.http.routers.${PROJECT_NAME}_varnish.rule=Host(`${COOLIFY_URL}`)"
  #     - "traefik.http.routers.${PROJECT_NAME}_varnish.tls=true"
  #     - "traefik.http.services.${PROJECT_NAME}_varnish.loadbalancer.server.port=6081"
  #     - "traefik.http.routers.${PROJECT_NAME}_varnish.service=${PROJECT_NAME}_varnish@docker"
  #     - "traefik.docker.network=traefik_proxy"

  mailhog:
    image: mailhog/mailhog
    networks:
      - default
      - coolify
    container_name: "${PROJECT_NAME}_mailhog"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}_mailhog.entrypoints=https"
      - "traefik.http.routers.${PROJECT_NAME}_mailhog.rule=Host(`${COOLIFY_URL}`) && PathPrefix(`/mailhog`)"
      - "traefik.http.middlewares.${PROJECT_NAME}_mailhog.stripprefix.prefixes=/mailhog"
      #### use these middlewares (rules like our-auth,our-retry,our-ratelimit are defined within traefik's labels)
      - "traefik.http.routers.${PROJECT_NAME}_mailhog.middlewares=our-slash@docker"
      - "traefik.http.routers.${PROJECT_NAME}_mailhog.tls=true"
      - "traefik.http.services.${PROJECT_NAME}_mailhog.loadbalancer.server.port=8025"
      - "traefik.http.routers.${PROJECT_NAME}_mailhog.service=${PROJECT_NAME}_mailhog@docker"
      - "traefik.docker.network=traefik_proxy"


