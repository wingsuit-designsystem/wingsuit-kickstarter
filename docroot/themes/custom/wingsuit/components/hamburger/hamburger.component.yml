# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human-readable name.
name: Hamburger

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
variants:
  default:
    title: Default
  horizontal:
    title: "Horizontal"
props:
  type: object
  properties:
    size:
      type: string
      title: Size
      enum:
        - small
        - default
        - large
        - xlarge
      meta:enum:
        small: Small
        default: Default
        large: Large
        xlarge: xLarge
    active_behaviour:
      type: string
      label: Hamburger Active behaviour
      description: Which animation to play when clicking on the hamburger.
      default_value: squeeze
      enum:
        - squeeze
        - slide
        - arrow
        - arrow_alt
        - arrow_turn
        - spin
      meta:enum:
        squeeze: Squeeze
        slide: Slide
        arrow: Arrow
        arrow_alt: Arrow Alt
        arrow_turn: Arrow Turn
        spin: Spin


# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.

