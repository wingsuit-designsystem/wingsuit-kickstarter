# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human-readable name.
name: Pagination

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
variants:
  default:
    title: Default
  mini:
    title: "Mini"
props:
  type: object
  properties:
    ellipses:
      type: boolean
      title: Ellipses
      description: |
        If there are more pages than the quantity allows, then an
        ellipsis before or after the listed pages may be present. Associative Array with following values:

        'previous': Present if the currently visible list of pages does not start at the first page.

        'next': Present if the visible list of pages ends before the last page.
      preview:
        previous: false
        next: true
    current:
      type: string
      title: Current
      description: The page number of the current page
      default_value: '1'
    show_actions:
      type: string
      title: Show Actions
      description: Display 'next' and 'previous' action links
      default_value: 0
    show_pages:
      type: string
      title: Show Pages
      description: Display the pages array.
      default_value: 1
    show_first_last:
      type: string
      title: Show first and last
      description: Show links to jump to first or last item of the pagination
      default_value: 0


# Slots always hold arbitrary markup. We know that beforehand, so no need for
# a schema for slots.
slots:
  # The key is the name of the slot. In your template you will use
  # {% block content %}.
    heading_id:
      type: text
      label: Heading Id
      description: Pagination heading ID.
    items:
      type: object
      label: Items
      description: |
        Item list is keyed by the following elements:

        'first': Item for the first page; not present on the first page of results

        'previous':  Item for the previous page; not present on the first page of results

        'next': Item for the next page; not present on the last page of results

        'last': Item for the last page; not present on the last page of results

        'pages': List of pages, keyed by page number

        **'items.first', 'items.previous', 'items.next', 'items.last' & each item inside 'items.pages' contain the following elements:**

        'href': URL with appropriate query parameters for the item

        'attributes': A keyed list of HTML attributes for the item

        'text': The visible text used for the item link, such as "‹ Previous" or "Next ›"
      example:
        first:
          - title: 'First Page'
            href: '#'
            attributes: 'foo'
            in_active_trail: false
        previous:
          - title: 'Previous Page'
            href: '#'
            attributes: 'foo'
            in_active_trail: false
        next:
          - title: 'Next Page'
            href: '#'
            attributes: 'foo'
            in_active_trail: false
        last:
          - title: 'Last Page'
            href: '#'
            attributes: 'foo'
            in_active_trail: false
        pages:
          - title: 'Page 1'
            href: '#'
            attributes: 'foo'
            in_active_trail: true
          - title: 'Page 2'
            href: '#'
            attributes: 'foo'
          - title: 'Page 3'
            href: '#'
            attributes: 'foo'
          - title: 'Page 4'
            href: '#'
            attributes: 'foo'
          - title: 'Page 5'
            href: '#'
            attributes: 'foo'
          - title: 'Page 6'
            href: '#'
            attributes: 'foo'
          - title: 'Page 7'
            href: '#'
            attributes: 'foo'
          - title: 'Page 8'
            href: '#'
            attributes: 'foo'


